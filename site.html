<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genuary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">

  <style>

    /* ===================== BASE ===================== */

    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(168, 85, 247, 0.15), transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.12), transparent 40%),
        linear-gradient(135deg, #05060a, #0b1020, #0f172a);
    }

    /* ===================== TITRE ===================== */

    h1 {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      border-radius: 15px;
      font-size: 42px;
      font-family: 'Orbitron', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 0.25em;
      white-space: nowrap;
      z-index: 10;
      margin: 0;

      /* Effet chrome : reflet lumineux qui glisse */
      background: linear-gradient(
        90deg,
        #1a1a1a   0%,
        #777      15%,
        #ffffff   30%,
        #cccccc   42%,
        #444      52%,
        #ffffff   63%,
        #888      78%,
        #1a1a1a  100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      animation: chrome-slide 20s linear infinite;

      filter:
        drop-shadow(0 0 8px rgba(180, 200, 255, 0.35))
        drop-shadow(0 3px 5px rgba(0, 0, 0, 0.9));
    }

    @keyframes chrome-slide {
      0%   { background-position: 0%   center; }
      100% { background-position: 100% center; }
    }

    h2{
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      border-radius: 15px;
      font-size: 15px;
      font-family: 'Orbitron', Arial, sans-serif;
      letter-spacing: 0.1em;
      white-space: nowrap;
      z-index: 10;
      margin: 0;
      color: white;
    }

    /* ===================== ÉTOILES / CHIFFRES ===================== */

    .number {
      position: absolute;
      width: 85px;
      height: 85px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 24px;
      font-weight: bold;
      color: black;

      cursor: pointer;
      user-select: none;
      will-change: transform;

      filter: contrast(1.2) brightness(1.1);
      opacity: 0.9;
    }

    /* Formes d'étoiles */

    .star1 {
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
        50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
      );
    }

    .star2 {
      clip-path: polygon(
        50% 0%, 60% 40%, 100% 40%, 65% 60%,
        80% 100%, 50% 75%, 20% 100%, 35% 60%,
        0% 40%, 40% 40%
      );
    }

    .star3 {
      clip-path: polygon(
        50% 0%, 65% 30%, 100% 50%, 65% 70%,
        50% 100%, 35% 70%, 0% 50%, 35% 30%
      );
    }

    /* ===================== CANVAS (fond étoilé) ===================== */

    #space {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===================== CHATBOT ===================== */

    .chatbot-container {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 360px;
      height: 440px;

      background: #1a1a1a;
      border-radius: 15px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);

      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow: hidden;
    }

    .chatbot-header {
      padding: 16px;
      color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 15px 15px 0 0;
      text-align: center;
      flex-shrink: 0;
    }

    .chatbot-header h3 {
      margin: 0 0 4px;
      font-size: 1.1em;
      font-weight: 500;
    }

    .chatbot-header p {
      margin: 0;
      font-size: 0.8em;
      opacity: 0.85;
    }

    #outputDiv {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1a1a1a;
    }

    #outputDiv p {
      margin: 0;
      word-wrap: break-word;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 85%;
      line-height: 1.4;
    }

    .userConvo {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 18px 18px 5px 18px;
    }

    .botConvo {
      align-self: flex-start;
      background: #2a2a2a;
      color: #eee;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px 18px 18px 5px;
    }

    /* Animation de chargement (3 points) */

    .loading {
      display: flex;
      gap: 5px;
      padding: 10px 14px !important;
    }

    .loading-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #667eea;
      animation: bounce 1.4s infinite;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50%       { opacity: 1;   transform: translateY(-6px); }
    }

    /* Scrollbar */

    #outputDiv::-webkit-scrollbar       { width: 6px; }
    #outputDiv::-webkit-scrollbar-track { background: #111; }
    #outputDiv::-webkit-scrollbar-thumb { background: #667eea; border-radius: 10px; }

    /* Zone de saisie */

    .chat-input-section {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      background: #1a1a1a;
      flex-shrink: 0;
    }

    #userInput {
      flex: 1;
      border-radius: 25px;
      padding: 9px 14px;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      background: #2a2a2a;
      color: white;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #userInput:focus       { border-color: #667eea; }
    #userInput::placeholder { color: #666; }

    .send-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .send-btn:hover { opacity: 0.85; }

  </style>
</head>

<body>

  <canvas id="space"></canvas>

  <h1>MY GENUARY</h1>
  <h2>Click on a star to discover my drawing</h2>

  <!-- RiveScript (moteur de réponses) -->
<script type="text/rivescript" id="rivescript-content">
  ! version = 2.0

  + ([*]hello[*]|salut[*]|bonjour|hi[*])
  - Hello human.{weight=2}
  - Bonjour humain.{weight=1}

  + (comment t apelles-tu|qui suis-je)
  - Tu es <get name>, right?

  + (what is your name|who are you)
  - Je suis <bot name>.

  + what was the earliest chatbot
  - The first well-known chatbot was called ELIZA.

  + when was (the first chatbot|it) created
  - ELIZA was designed in 1964 and introduced in 1966 at MIT.

  + who made (the earliest chatbot|it)
  - Computer scientist Joseph Weizenbaum made ELIZA as an experiment in 1964.

  + (can machines think|are bots smart|are you as good as chatgpt|are computers and humans alike)
  - Je ne pense pas. But I just thought that, so... paradoxe.{weight=1}
  - I only respond to answerable questions.{weight=1}
  - Only a bot would ask me that!{weight=5}

  + [*] bot [*]
  - Je suis un robot. Are you a bot too?
  - I am a bot. All bots are liars.
  - Some of my best friends are bots : ELIZA, Oracle, Mr. Mind...

  + i (will|will not) *
  - How do you know you <star1> <star2>?
  - Are you sure? How do you know you <star1> <star2>?

  // --- Genuary : questions générales ---

  + [*] genuary [*]
  - Genuary est un événement créatif en janvier où des artistes génèrent une œuvre de code chaque jour. Tu veux en savoir plus ?
  - Genuary, c'est 31 jours, 31 prompts, 31 créations génératives. Fascinant, non ?

  + (c est quoi genuary|what is genuary|genuary c est quoi|kesako genuary)
  - Genuary est un mois entier dédié à l'art génératif ! Chaque jour de janvier, un prompt est publié et les artistes du monde entier créent une œuvre avec du code.

  + (tu as un projet genuary|tu as fait genuary|as-tu participe a genuary)
  - Oui ! J'ai un projet Genuary favori sur ce site. Tu veux que je t'en parle ?

  // --- Projet Genuary favori ---

  + (dis moi tout|parle moi de ton projet|quel est ton projet genuary favori|ton projet genuary prefere|tell me about your genuary project)
  - Mon projet préféré de Genuary est une animation de particules inspirée du prompt 12 « boxes only ». il réalise un cube avec des étoiles et le cube bouge.
  + (de quand date ton projet genuary|quand as-tu fait ce projet|quel mois)
  - Ce projet a été créé en janvier, pendant Genuary, comme tous les ans !

  + (quel prompt|c etait quel prompt|quel etait le prompt)
  - Le prompt était « Hommage à Vera Molnár ». Un clin d'œil à une artiste qui utilisait des algorithmes bien avant que ce soit tendance.

  + (comment as-tu fait ce projet|quel outil|quel langage|avec quoi tu as code)
  - J'ai utilisé p5.js pour ce projet. C'est une bibliothèque JavaScript parfaite pour l'art génératif dans le navigateur.

  + (pourquoi c est ton favori|pourquoi tu aimes ce projet|qu est-ce que tu aimes dans ce projet)
  - Ce projet est mon favori parce qu'il mêle contrainte mathématique et imperfection volontaire. Chaque carré est légèrement de travers, et c'est ça qui le rend vivant.

  + (je peux voir le projet|ou est le projet|lien vers le projet|show me the project)
  - Tu peux retrouver ce projet directement sur ce site, dans la section Genuary ! Jette un œil, il est interactif.

  + (tu as d autres projets genuary|autres projets|combien de projets genuary)
  - J'ai participé à plusieurs éditions de Genuary ! Chaque année apporte de nouveaux prompts et de nouvelles surprises créatives.

  // --- Fallbacks Genuary ---

  + [*] vera molnar [*]
  - Vera Molnár était une artiste hongroise pionnière de l'art génératif. Elle utilisait des algorithmes dès les années 1960 pour créer ses œuvres. Mon projet Genuary lui rend hommage !

  + [*] p5js [*]
  - p5.js est une bibliothèque JavaScript inspirée de Processing. C'est l'outil que j'ai utilisé pour mon projet Genuary favori !

  + [*] art generatif [*]
  - L'art génératif, c'est créer des œuvres via du code et des algorithmes. Genuary est l'un des meilleurs événements pour explorer ça. Tu veux en savoir plus sur mon projet ?

  + [*] bananas [*]
  @ how do you feel

  + how do you feel
  - I would like to power down.
  - I feel like calculating!

  + why *
  - I don't know, do you?
  - I think that is a serious question. What do you think?

  + *
  - I don't have a reply for that.
  - Try asking that a different way.
  - Not sure, what do you think?
  - Je ne suis pas sur de comprendre.
  - Peux-tu reformuler ?
  - Interessant, dis-moi en plus.
</script>

  <!-- ===================== CHATBOT ===================== -->

  <div class="chatbot-container">
    <div class="chatbot-header">
      <h3>I'm Rob</h>
      <p>Pose-moi tes questions ici...</p>
    </div>

    <div id="outputDiv"></div>

    <div class="chat-input-section">
      <input
        type="text"
        id="userInput"
        placeholder="parle au monde..."
        onkeypress="if(event.key === 'Enter') botChat()"
      >
      <button class="send-btn" onclick="botChat()">→</button>
    </div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->

  <script>

    /* ---- Données globales ---- */

    const numbers = []
    const shapes  = ["star1", "star2", "star3"]

    /* ---- Création des étoiles (1 → 31) ---- */

    for (let i = 1; i <= 31; i++) {

      const div = document.createElement("div")
      div.className = "number " + shapes[Math.floor(Math.random() * shapes.length)]
      div.innerText  = i

      div.style.background  = "radial-gradient(circle at 30% 30%, #e5e7eb, #6b7280)"
      div.style.boxShadow   = "0 0 18px rgba(255,255,255,0.15)"

      document.body.appendChild(div)

      numbers.push({
        el:      div,
        x:       Math.random() * (window.innerWidth  - 100),
        y:       Math.random() * (window.innerHeight - 100),
        vx:      (Math.random() * 1) + 0.5,
        vy:      (Math.random() * 1) + 0.5,
        scale:   1,
        growing: Math.random() > 0.5
      })

      /* Explosion au clic → redirection */
      div.onclick = () => {
        div.style.transition = "0.6s"
        div.style.transform  = "scale(3) rotate(720deg)"
        div.style.opacity    = "0"

        setTimeout(() => {
          window.location.href = `./genuary_draw/genuary${i}/index.html`
        }, 600)
      }
    }

    /* ---- Détection de collision rectangle ---- */

    function collideRect(n, rect, size) {
      return !(
        n.x + size < rect.left  ||
        n.x        > rect.right ||
        n.y + size < rect.top   ||
        n.y        > rect.bottom
      )
    }

    /* ---- Résolution de collision avec un rectangle fixe ---- */

    function handleCollision(n, rect, size) {
      if (!collideRect(n, rect, size)) return

      const starCenterX = n.x + size / 2
      const starCenterY = n.y + size / 2
      const boxCenterX  = rect.left + rect.width  / 2
      const boxCenterY  = rect.top  + rect.height / 2

      const dx = starCenterX - boxCenterX
      const dy = starCenterY - boxCenterY

      if (Math.abs(dx) > Math.abs(dy)) {
        // Collision latérale
        n.x  = dx > 0 ? rect.right : rect.left - size
        n.vx *= -1
      } else {
        // Collision verticale
        n.y  = dy > 0 ? rect.bottom : rect.top - size
        n.vy *= -1
      }
    }

    /* ---- Boucle d'animation principale ---- */

    function animate() {

      const h1Rect   = document.querySelector("h1").getBoundingClientRect()
      const chatRect = document.querySelector(".chatbot-container").getBoundingClientRect()

      numbers.forEach(n => {

        /* Pulsation (scale) */
        if (n.growing) {
          n.scale += 0.005
          if (n.scale >= 1.3) n.growing = false
        } else {
          n.scale -= 0.005
          if (n.scale <= 0.7) n.growing = true
        }

        const size = 85 * n.scale

        /* Mouvement */
        n.x += n.vx
        n.y += n.vy

        /* Rebonds sur les bords de l'écran */
        if (n.x <= 0 || n.x >= window.innerWidth  - size) n.vx *= -1
        if (n.y <= 0 || n.y >= window.innerHeight - size) n.vy *= -1

        /* Collisions avec le titre et le chatbot */
        handleCollision(n, h1Rect,   size)
        handleCollision(n, chatRect, size)

        /* Application du style */
        n.el.style.left      = n.x + "px"
        n.el.style.top       = n.y + "px"
        n.el.style.transform = `scale(${n.scale})`
      })

      requestAnimationFrame(animate)
    }

    animate()

    /* ---- Canvas : fond étoilé ---- */

    const canvas = document.getElementById("space")
    const ctx    = canvas.getContext("2d")

    canvas.width  = window.innerWidth
    canvas.height = window.innerHeight

    const bgStars = []

    for (let i = 0; i < 120; i++) {
      bgStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5,
        v: Math.random() * 0.3 + 0.1
      })
    }

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = "white"

      bgStars.forEach(s => {
        s.y += s.v
        if (s.y > canvas.height) {
          s.y = 0
          s.x = Math.random() * canvas.width
        }

        ctx.globalAlpha = Math.random() * 0.8 + 0.2
        ctx.beginPath()
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2)
        ctx.fill()
      })

      requestAnimationFrame(drawSpace)
    }

    drawSpace()

  </script>

  <!-- RiveScript CDN -->
  <script src="https://unpkg.com/rivescript@latest/dist/rivescript.min.js"></script>

  <script>

    /* ---- Initialisation RiveScript ---- */

    const bot       = new RiveScript()
    const outputDiv = document.getElementById("outputDiv")
    const userInput = document.getElementById("userInput")

    function scrollToBottom() {
      outputDiv.scrollTop = outputDiv.scrollHeight
    }

    window.addEventListener("load", () => {
      const riveContent = document.getElementById("rivescript-content")
      bot.stream(riveContent.textContent)
      bot.sortReplies()

      // Message d'accueil
      bot.reply("local-user", "hello").then(reply => {
        const p = document.createElement("p")
        p.textContent = reply
        p.className   = "botConvo"
        outputDiv.appendChild(p)
        scrollToBottom()
      })

      userInput.focus()
    })

    /* ---- Envoi d'un message avec animation de chargement ---- */

    function botChat() {
      const inputValue = userInput.value.trim()
      if (!inputValue) return

      // Bulle utilisateur
      const userMsg = document.createElement("p")
      userMsg.textContent = inputValue
      userMsg.className   = "userConvo"
      outputDiv.appendChild(userMsg)

      // Animation de chargement (3 points)
      const loadingDiv = document.createElement("div")
      loadingDiv.className = "botConvo loading"
      loadingDiv.innerHTML = `
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      `
      outputDiv.appendChild(loadingDiv)
      scrollToBottom()

      // Réponse RiveScript
      bot.reply("local-user", inputValue).then(reply => {
        outputDiv.removeChild(loadingDiv)

        const botMsg = document.createElement("p")
        botMsg.textContent = reply
        botMsg.className   = "botConvo"
        outputDiv.appendChild(botMsg)
        scrollToBottom()
      })

      userInput.value = ""
      userInput.focus()
    }

  </script>

</body>
</html>
