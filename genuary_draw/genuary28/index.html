<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Étoiles régulières</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
  }
  svg {
    background: #000;
  }
</style>
</head>
<body>

<svg id="svg" width="480" height="480" viewBox="0 0 480 480">
  <path id="star" fill="none" stroke="white" stroke-width="2"/>
</svg>

<script>
/* -----------------------------
   PARAMÈTRES (identiques)
------------------------------ */
let DESSIN = 7; // [7,8,9,10,11,12]

let NP = 480;
let PI = Math.PI;
let K = 5, H = 3;
let CX = NP / 2, CY = NP / 2;
let R = NP * 0.45;
let AD = PI / 2;

if (DESSIN == 8) {
  K = 7;
} else if (DESSIN == 9) {
  K = 20; H = 9;
} else if (DESSIN == 10) {
  K = 20; H = 7;
} else if (DESSIN == 11) {
  K = 51; H = 20;
} else if (DESSIN == 12) {
  K = 51; H = 25;
}

/* -----------------------------
   GÉNÉRATION DU PATH SVG
------------------------------ */
let d = "";

for (let I = 0; I < K; I++) {
  let angle = 2 * I * H * PI / K + AD;
  let X = Math.round(CX + R * Math.cos(angle));
  let Y = Math.round(CY + R * Math.sin(angle));

  if (I === 0) {
    d += `M ${X} ${Y} `;
  } else {
    d += `L ${X} ${Y} `;
  }
}

d += "Z"; // fermer la forme

document.getElementById("star").setAttribute("d", d);
</script>

</body>
</html>
