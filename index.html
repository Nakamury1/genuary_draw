<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuary — Chemin animé</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }
    h1 {
      color: white;
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }
    .wrap { width: 100%; max-width: 900px; }
    canvas { display: block; width: 100%; border-radius: 12px; cursor: default; }
    canvas.pointer { cursor: pointer; }
    .info-bar {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 13px;
      color: #aaa;
      min-height: 20px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 1rem;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 20px;
      border: 0.5px solid rgba(255,255,255,0.15);
      transition: background 0.2s;
      text-decoration: none;
    }
    .leg-item:hover { background: rgba(255,255,255,0.08); color: white; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* CHATBOT */
    .chatbot-section { width: 100%; max-width: 600px; margin-top: 3rem; }
    .chatbot-container {
      background: #1a1a1a;
      border-radius: 15px;
      border: 0.5px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      height: 500px;
      overflow: hidden;
    }
    .chatbot-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .chatbot-header h2 { font-size: 1.3em; margin-bottom: 4px; font-weight: 500; }
    .chatbot-header p { font-size: 0.85em; opacity: 0.85; }
    #outputDiv {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #outputDiv p {
      word-wrap: break-word;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      line-height: 1.4;
      font-size: 0.9em;
    }
    .userConvo {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 18px 18px 5px 18px;
    }
    .botConvo {
      align-self: flex-start;
      background: #2a2a2a;
      color: #eee;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 18px 18px 18px 5px;
    }
    .chat-input-section {
      padding: 12px;
      border-top: 0.5px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 8px;
      background: #1a1a1a;
    }
    #userInput {
      flex: 1;
      padding: 10px 14px;
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      font-size: 0.9em;
      font-family: inherit;
      background: #2a2a2a;
      color: white;
      outline: none;
      transition: border-color 0.2s;
    }
    #userInput:focus { border-color: #667eea; }
    #userInput::placeholder { color: #666; }
    .send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9em;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }
    .loading { display: flex; gap: 5px; padding: 10px 14px !important; }
    .loading-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #667eea;
      animation: bounce 1.4s infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-6px); }
    }
    #outputDiv::-webkit-scrollbar { width: 6px; }
    #outputDiv::-webkit-scrollbar-track { background: #111; }
    #outputDiv::-webkit-scrollbar-thumb { background: #667eea; border-radius: 10px; }
  </style>
</head>
<body>

  <h1>🎨 GENUARY</h1>

  <div class="wrap">
    <canvas id="c" height="340"></canvas>
    <div class="info-bar" id="info">survole un rond · clique pour ouvrir la création</div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="chatbot-section">
    <div class="chatbot-container">
      <div class="chatbot-header">
        <h2>🤖 Chatbot</h2>
        <p>Posez vos questions ici...</p>
      </div>
      <div id="outputDiv"></div>
      <div class="chat-input-section">
        <input type="text" id="userInput" placeholder="Écrivez votre message..."
          onkeypress="if(event.key==='Enter') botChat()">
        <button class="send-btn" onclick="botChat()">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- RiveScript embarqué -->
  <script type="text/rivescript" id="rivescript-content">
    ! version = 2.0

    + ([*]hello[*]|salut[*]|bonjour|hi[*])
    - Hello human.{weight=2}
    - Bonjour humain{weight=1}

    + (comment t apelles-tu ? | Qui-suis-je ?)
    - tu es <get name>, right?
    - <get name> == undefinied == You never told me your name.

    + (what is your name|who are you)
    - je suis <bot name>

    + what was the earliest chatbot
    - The first well-known chatbot was called ELIZA.

    + when was (the first chatbot|it) created
    - ELIZA was designed in 1964 and introduced in 1966 at MIT.

    + who made (the earliest chatbot|it)
    - Computer scientist Joseph Weizenbaum made the bot ELIZA as an experiment in 1964

    + (can machines think|are bots smart|are you as good as chatgpt|are computers and humans alike)
    - Je ne pense pas. But I just thought that, so ... c est un paradox.{weight=1}
    - I only respond to answerable questions.{weight=1}
    - Only a bot would ask me "<star>"!{weight=5}

    + [*] bot [*]
    - je suis un robot. Are you a bot too?
    - I am a bot. All bots are liars. (This is a quote from another bot called Mr. Mind.)
    - Some of my best friends are bots. Laisse-moi voir, c est ELIZA, Oracle, Mr. Mind, ladymouth...

    + i (will|will not) *
    - How do you know you <star1> <star2>?
    - Are you sure about that? How do you know you <star1> <star2>?

    + [*] genuary [*]
    - c'est privé
    - non je ne peux pas le faire
    - non, à toi de le faire

    + [*] bananas [*]
    @ how do you feel

    + how do you feel
    - I'd like to power down.
    - I feel like calculating!

    + why *
    - I don't know, do you?
    - I think that is a {random}pickle|problem|serious question{/random}. What do you think?

    + *
    - I don't have a reply for that.
    - Try asking that a different way.
    - Not sure, what do you think?
    - Je ne suis pas sûr de comprendre.
    - Peux-tu me refaire ta phrase ?
    - Intéressant, dis-moi en plus.
  </script>

  <script src="https://unpkg.com/rivescript@latest/dist/rivescript.min.js"></script>

  <script>
    /* ════════════════════════════
       CANVAS ANIMÉ
    ════════════════════════════ */
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const infoBar = document.getElementById('info');

    const palette = [
      '#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD',
      '#639922','#BA7517','#E24B4A','#533AB7','#0F6E56',
      '#993C1D','#993556','#185FA5','#3B6D11','#854F0B',
      '#A32D2D','#3C3489','#085041','#712B13','#72243E',
      '#0C447C','#27500A','#633806','#791F1F','#26215C',
      '#04342C','#4A1B0C','#4B1528','#042C53','#173404',
      '#412402'
    ];

    const prompts = [
      "Pixels","Moins de 10","Troisième œil","Bruit fractal","Isométrique",
      "Symétrie naturelle","Spirale","Retro future","Espace négatif","Ombres",
      "Règle de tiers","Palette restreinte","Intérieur","Flux","Lignes brisées",
      "Couleurs complémentaires","Voronoi","Typographie","Données naturelles","Grille déformée",
      "Vague","Miroir miroir","Collision","Glitch","Cercles tangents",
      "Gravure","Fibonacci","Lumière","Profondeur","Mosaïque","Fin du mois"
    ];

    const N = 31;
    let W, H, nodes = [], anim = 0, hovered = -1, pathProgress = 0, lastTime = 0;

    function getLink(i) {
      return `./%23genuary${i + 1}/index.html`;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      W = rect.width; H = 340;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.scale(dpr, dpr);
      buildNodes();
    }

    function buildNodes() {
      nodes = [];
      const cols = Math.max(4, Math.floor(W / 80));
      const rows = Math.ceil(N / cols);
      const cellW = W / cols, cellH = (H - 40) / rows;
      const r = Math.min(cellW, cellH) * 0.28;
      for (let i = 0; i < N; i++) {
        nodes.push({
          x: cellW * (i % cols + 0.5) + Math.sin(i * 2.4) * 0.15 * cellW,
          y: 20 + cellH * (Math.floor(i / cols) + 0.5) + Math.cos(i * 1.7) * 0.15 * cellH,
          r, color: palette[i],
          label: String(i + 1).padStart(2, '0'),
          prompt: prompts[i],
          phase: i * 0.31
        });
      }
    }

    function hexToRgb(h) {
      return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) };
    }

    function getPathColor(t) {
      const i = Math.floor(t * (N-1)), f = t * (N-1) - i;
      const c1 = hexToRgb(palette[Math.min(i, N-1)]), c2 = hexToRgb(palette[Math.min(i+1, N-1)]);
      return `rgb(${Math.round(c1.r+(c2.r-c1.r)*f)},${Math.round(c1.g+(c2.g-c1.g)*f)},${Math.round(c1.b+(c2.b-c1.b)*f)})`;
    }

    function catmullRom(pts, t) {
      const n = pts.length, total = n - 1;
      const seg = Math.min(Math.floor(t * total), total - 1), lt = t * total - seg;
      const p0 = pts[Math.max(seg-1,0)], p1 = pts[seg], p2 = pts[Math.min(seg+1,n-1)], p3 = pts[Math.min(seg+2,n-1)];
      const tt = lt, tt2 = tt*tt, tt3 = tt2*tt;
      return {
        x: 0.5*((2*p1.x)+(-p0.x+p2.x)*tt+(2*p0.x-5*p1.x+4*p2.x-p3.x)*tt2+(-p0.x+3*p1.x-3*p2.x+p3.x)*tt3),
        y: 0.5*((2*p1.y)+(-p0.y+p2.y)*tt+(2*p0.y-5*p1.y+4*p2.y-p3.y)*tt2+(-p0.y+3*p1.y-3*p2.y+p3.y)*tt3)
      };
    }

    function drawPath(progress) {
      if (nodes.length < 2) return;
      const steps = 300;
      ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let i = 0; i < Math.floor(steps * progress); i++) {
        const p0 = catmullRom(nodes, i / steps), p1 = catmullRom(nodes, (i+1) / steps);
        ctx.beginPath();
        ctx.strokeStyle = getPathColor(i / steps);
        ctx.globalAlpha = 0.55;
        ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function draw(ts) {
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;
      anim += dt * 3;
      if (pathProgress < 1) pathProgress = Math.min(pathProgress + dt * 0.85, 1);
      ctx.clearRect(0, 0, W, H);
      drawPath(pathProgress);

      nodes.forEach((n, i) => {
        if (pathProgress <= i / (N - 1)) return;
        const t = anim + n.phase;
        const bob = Math.sin(t) * 2.5;
        const pulse = 1 + Math.sin(t * 1.8) * 0.04;
        const isHov = hovered === i;
        const s = isHov ? 1.22 : pulse;
        const rx = n.x, ry = n.y + bob, rr = n.r * s;

        ctx.save();
        ctx.shadowColor = n.color;
        ctx.shadowBlur = isHov ? 20 : 8;
        ctx.beginPath();
        ctx.arc(rx, ry, rr, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.globalAlpha = isHov ? 1 : 0.88;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(rx, ry, rr, 0, Math.PI * 2);
        ctx.strokeStyle = isHov ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = isHov ? 2.5 : 1.5;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = `500 ${Math.round(rr * 0.5)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.label, rx, ry);
        if (isHov) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = n.color;
          ctx.font = `400 12px 'Segoe UI', sans-serif`;
          ctx.fillText(n.prompt + ' →', rx, ry + rr + 15);
        }
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }

    function getHoveredNode(mx, my) {
      let found = -1;
      nodes.forEach((n, i) => {
        const bob = Math.sin(anim + n.phase) * 2.5;
        const dx = mx - n.x, dy = my - (n.y + bob);
        if (Math.sqrt(dx*dx + dy*dy) < n.r * 1.35) found = i;
      });
      return found;
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const found = getHoveredNode(e.clientX - rect.left, e.clientY - rect.top);
      if (found !== hovered) {
        hovered = found;
        if (found >= 0) {
          infoBar.textContent = `Genuary ${found+1} — "${prompts[found]}" · cliquer pour ouvrir`;
          canvas.classList.add('pointer');
        } else {
          infoBar.textContent = 'survole un rond · clique pour ouvrir la création';
          canvas.classList.remove('pointer');
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hovered = -1;
      canvas.classList.remove('pointer');
      infoBar.textContent = 'survole un rond · clique pour ouvrir la création';
    });

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const found = getHoveredNode(e.clientX - rect.left, e.clientY - rect.top);
      if (found >= 0) window.location.href = getLink(found);
    });

    /* Légende cliquable */
    const legend = document.getElementById('legend');
    for (let i = 0; i < N; i++) {
      const el = document.createElement('a');
      el.className = 'leg-item';
      el.href = getLink(i);
      el.title = prompts[i];
      el.innerHTML = `<span class="leg-dot" style="background:${palette[i]}"></span><span>${i+1}</span>`;
      el.addEventListener('mouseenter', () => { hovered = i; infoBar.textContent = `Genuary ${i+1} — "${prompts[i]}"`; });
      el.addEventListener('mouseleave', () => { hovered = -1; infoBar.textContent = 'survole un rond · clique pour ouvrir la création'; });
      legend.appendChild(el);
    }

    resize();
    window.addEventListener('resize', () => { pathProgress = 0; resize(); });
    requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(draw); });


    /* ════════════════════════════
       CHATBOT RIVESCRIPT
    ════════════════════════════ */
    var bot = new RiveScript();
    var outputDiv = document.getElementById('outputDiv');
    var userInput = document.getElementById('userInput');

    function scrollToBottom() { outputDiv.scrollTop = outputDiv.scrollHeight; }

    function botReady() {
      bot.reply("local-user", "hello").then(function(reply) {
        var p = document.createElement('p');
        p.textContent = reply;
        p.className = 'botConvo';
        outputDiv.appendChild(p);
        scrollToBottom();
      });
    }

    window.addEventListener('load', function() {
      var riveContent = document.getElementById('rivescript-content');
      bot.stream(riveContent.textContent);
      bot.sort();
      botReady();
      userInput.focus();
    });

    function botChat() {
      bot.sortReplies();
      var inputValue = userInput.value.trim();
      if (inputValue === '') return;

      var userMsg = document.createElement('p');
      userMsg.textContent = inputValue;
      userMsg.className = 'userConvo';
      outputDiv.appendChild(userMsg);

      var loadingDiv = document.createElement('div');
      loadingDiv.className = 'botConvo loading';
      loadingDiv.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';
      outputDiv.appendChild(loadingDiv);
      scrollToBottom();

      bot.reply("local-user", inputValue).then(function(reply) {
        outputDiv.removeChild(loadingDiv);
        var botMsg = document.createElement('p');
        botMsg.textContent = reply;
        botMsg.className = 'botConvo';
        outputDiv.appendChild(botMsg);
        scrollToBottom();
      });

      userInput.value = '';
      userInput.focus();
    }
  </script>
</body>
</html>
